version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: finpredict-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: finpredict_admin
      MONGO_INITDB_ROOT_PASSWORD: secure_finpredict_password_2026
      MONGO_INITDB_DATABASE: finpredict_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Express Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finpredict-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://finpredict_admin:secure_finpredict_password_2026@mongodb:27017/finpredict_db?authSource=admin
      JWT_SECRET: institutional_super_secret_jwt_key_2026
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  # 3. React Frontend Client (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finpredict-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
